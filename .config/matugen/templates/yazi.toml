
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
preview_hovered = { underline = true }

find_keyword = { fg = "{{colors.error.default.hex}}", italic = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", italic = true }

marker_copied = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_selected = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

count_copied = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
count_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

[tabs]
active = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}" }
separator_style = { fg = "{{colors.outline.default.hex}}", bg = "{{colors.surface.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
normal_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
select_main = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
select_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
unset_main = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
unset_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

