# Hypridle configuration for a university laptop.
#
# Idle policy:
#   3 min   - dim panel and turn off keyboard backlight
#   10 min  - lock session
#   12 min  - turn off display
#   30 min  - suspend

general {
    # Keep the existing lock wrapper: it prepares the lock background and
    # starts hyprlock. The explicit inhibit_sleep mode below is important
    # because Hypridle cannot see through this wrapper to detect hyprlock.
    lock_cmd = ~/.config/hypr/scripts/lock.sh

    # Ask logind to lock the session before any sleep transition.
    before_sleep_cmd = loginctl lock-session

    # Wait for the Wayland session-lock surface to be up before suspending.
    # Mode 3 is required because lock_cmd is an indirect shell script wrapper.
    inhibit_sleep = 3

    # Re-enable the display and restore saved panel/keyboard brightness after
    # resume. The trailing true prevents an unavailable brightness device
    # from making the whole resume command report failure.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; brightnessctl -d nvidia_wmi_ec_backlight -r; brightnessctl -d platform::kbd_backlight -r; true
}

# Dim the panel after 3 minutes. Normal idle inhibitors remain respected,
# so video playback/presentations can keep the display awake.
listener {
    timeout = 180
    on-timeout = brightnessctl -d nvidia_wmi_ec_backlight -s set 10%
    on-resume = brightnessctl -d nvidia_wmi_ec_backlight -r
}

# Turn off the keyboard backlight after 3 minutes, even during video playback.
# This listener can ignore inhibitors without disabling them for screen lock
# or suspend.
listener {
    timeout = 180
    on-timeout = brightnessctl -d platform::kbd_backlight -s set 0
    on-resume = brightnessctl -d platform::kbd_backlight -r
    ignore_inhibit = true
}

# Lock after 10 minutes of inactivity.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off the display 2 minutes after locking.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 30 minutes of inactivity.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
