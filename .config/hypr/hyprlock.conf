
source = ~/.config/hypr/matugen-lock.conf

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    path = /tmp/hyprlock.png
    color = rgb($lock_bg)
    blur_passes = 0
}

# Top accent line
shape {
    size = 80%, 2
    color = rgb($lock_accent)
    position = 0, 32
    halign = center
    valign = top
}

# Session status
label {
    text = "YAHIA  /  SESSION LOCKED"
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = rgb($lock_secondary)

    position = 0, 52
    halign = center
    valign = top
}

# Profile picture
image {
    path = /home/yahia/Pictures/pfp.png
    size = 112
    rounding = -1
    border_size = 2
    border_color = rgb($lock_accent)

    position = 0, -165
    halign = center
    valign = center
}

# Greeting
label {
    text = "Welcome back, $USER"
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = rgb($lock_text)

    position = 0, -75
    halign = center
    valign = center
}

# Clock
label {
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgb($lock_text)

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb($lock_bg)

    position = 0, 15
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = JetBrainsMono Nerd Font
    font_size = 13
    color = rgb($lock_secondary)

    position = 0, 78
    halign = center
    valign = center
}

# Password
input-field {
    size = 340, 54
    outline_thickness = 2
    rounding = 6

    outer_color = rgb($lock_accent)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgb($lock_text)

    font_family = JetBrainsMono Nerd Font
    font_size = 15
    dots_size = 0.20
    dots_spacing = 0.25

    placeholder_text = <i>Enter password</i>
    check_text = <i>Checking...</i>
    fail_text = <i>Incorrect password</i>

    fade_on_empty = false
    check_color = rgb($lock_secondary)
    fail_color = rgb($lock_error)

    position = 0, 165
    halign = center
    valign = center
}

# Bottom details
label {
    text = cmd[update:60000] uptime -p
    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = rgb($lock_secondary)

    position = 0, 32
    halign = center
    valign = bottom
}

shape {
    size = 80%, 1
    color = rgb($lock_secondary)
    position = 0, 20
    halign = center
    valign = bottom
}

