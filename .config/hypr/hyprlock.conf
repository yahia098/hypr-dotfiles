
source = ~/.config/hypr/matugen-lock.conf

general {
    hide_cursor = true
}

background {
    path = /tmp/hyprlock.png
    blur_passes = 0
}

# Clock
label {
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 76
    color = rgb($lock_text)

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb($lock_bg)

    position = 0, 65
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = JetBrainsMono Nerd Font
    font_size = 17
    color = rgb($lock_secondary)

    position = 0, -5
    halign = center
    valign = center
}

# Password field
input-field {
    size = 320, 54
    outline_thickness = 2

    outer_color = rgb($lock_accent)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgb($lock_text)

    font_family = JetBrainsMono Nerd Font
    font_size = 16
    dots_size = 0.20
    dots_spacing = 0.25

    placeholder_text = <i>Enter password</i>
    fade_on_empty = false
    rounding = 8

    check_color = rgb($lock_secondary)
    fail_color = rgb($lock_error)

    position = 0, -100
    halign = center
    valign = center
}

