# =========================
# FONT
# =========================
font_family      JetBrainsMono Nerd Font
font_size        12.5
disable_ligatures never

# =========================
# THEME (Catppuccin Mocha hard-flat)
# =========================
foreground       #cdd6f4
background       #1e1e2e
selection_foreground #1e1e2e
selection_background #cdd6f4

# black
color0  #45475a
color8  #585b70

# red
color1  #f38ba8
color9  #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

# =========================
# WINDOW LAYOUT (hard-flat feel)
# =========================
window_padding_width 8
window_margin_width 0
hide_window_decorations yes
background_opacity 0.85

# no blur / no transparency nonsense
dynamic_background_opacity yes

# =========================
# CURSOR (clean terminal style)
# =========================
cursor_shape block
cursor_blink_interval 0

# =========================
# SCROLLBACK (tmux-like usability)
# =========================
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# =========================
# PERFORMANCE / CLEAN UI
# =========================
repaint_delay 10
input_delay 3

# disable unnecessary UI clutter
tab_bar_edge top
tab_bar_style fade
tab_bar_min_tabs 2
