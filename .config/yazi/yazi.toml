[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
tab_size = 2
max_width = 600
max_height = 900
image_delay = 30
image_filter = "triangle"

[opener]
zathura = [
    { run = "zathura --fork %s", orphan = true, desc = "Open PDF in Zathura", for = "unix" },
]

[open]
prepend_rules = [
    { url = "*.pdf", use = "zathura" },
]
